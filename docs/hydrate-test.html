<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grainflow — hydration check</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f2f3f5; --surface:#fff; --text:#14171a; --dim:#6b7280;
    --border:#e3e5e8; --ok:#2e7d32; --bad:#c0392b; --info:#0070c0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1013; --surface:#1a1d21; --text:#f0f1f3; --dim:#9aa1a9;
            --border:#2b2f34; --ok:#6adb7a; --bad:#ef8a7f; --info:#7fc0f5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 60px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.55; }
  .wrap { max-width:680px; margin:0 auto; }
  h1 { font-size:21px; margin:0 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim);
       margin:26px 0 10px; }
  .sub { color:var(--dim); font-size:13.5px; margin:0 0 18px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:13px;
          padding:16px 18px; margin-bottom:10px; }
  .verdict { font-weight:600; font-size:15.5px; }
  .verdict.ok { color:var(--ok); } .verdict.bad { color:var(--bad); }
  .verdict small { display:block; font-weight:400; color:var(--dim); margin-top:5px; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td { padding:6px 0; border-bottom:1px solid var(--border); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .zero { color:var(--dim); font-weight:400; }
  .denied { color:var(--info); font-size:12.5px; }
  .note { color:var(--dim); font-size:12.5px; margin-top:20px; }
  code { font-size:12px; background:var(--bg); padding:1px 5px; border-radius:4px; border:1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hydration check</h1>
  <p class="sub">Reads your farm out of Supabase and rebuilds the shape the app uses, then dry-runs your existing local season through the same mapping to show what it would become. Nothing is written.</p>
  <div id="out"><div class="card">Working…</div></div>
  <p class="note">Delete <code>docs/hydrate-test.html</code> once 1.3 is finished.</p>
</div>

<script type="module">
import { supabase } from './js/supabase.js?v=72';
import { getMembership } from './js/auth.js?v=72';
import { hydrate, summarise } from './js/hydrate.js?v=72';
import { stateToRows } from './js/mapping.js?v=72';

const out = document.getElementById('out');
const html = [];
const push = (s) => { html.push(s); out.innerHTML = html.join(''); };

function countsTable(list) {
  return `<table>${list.map(({ table, count }) => `
    <tr><td>${table}</td><td class="${count ? '' : 'zero'}">${count}</td></tr>`).join('')}</table>`;
}

const { data: sess } = await supabase.auth.getSession();
if (!sess?.session) {
  push(`<div class="card verdict bad">Not signed in.<small>Open the app, sign in, then come back to this page.</small></div>`);
} else {
  const membership = await getMembership();
  if (!membership) {
    push(`<div class="card verdict bad">Signed in, but no farm.<small>Create one in the app first.</small></div>`);
  } else {
    push(`<div class="card verdict ok">Signed in to ${membership.farmName}<small>Role: ${membership.role}</small></div>`);

    // --- what is actually in Supabase right now ---
    let result;
    try {
      result = await hydrate(membership.farmId);
    } catch (e) {
      push(`<div class="card verdict bad">Hydration threw.<small>${e.message}</small></div>`);
      throw e;
    }

    const { state, rows, denied } = result;
    const seasons = Object.keys(state.years);

    push(`<h2>In the database</h2>`);
    push(`<div class="card">${countsTable(summarise(rows))}</div>`);
    push(`<div class="card">
      <div class="verdict ok">Rebuilt the app shape</div>
      <small style="color:var(--dim);font-size:13px">
        ${seasons.length} season${seasons.length === 1 ? '' : 's'}${seasons.length ? ' — ' + seasons.join(', ') : ''}.
        Business name: ${state.businessDetails.entityName || '(not set)'}.
      </small>
    </div>`);

    if (denied.length) {
      push(`<div class="card"><div class="denied"><strong>Refused by row-level security:</strong>
        ${denied.map((d) => d.table).join(', ')}. For your role that is either
        correct or worth a look.</div></div>`);
    }

    // --- dry run: what your existing local season would become ---
    push(`<h2>Dry run — your local data</h2>`);
    const raw = localStorage.getItem('grainflow.v1');
    if (!raw) {
      push(`<div class="card"><small style="color:var(--dim)">No local Grainflow data in this browser, so nothing to preview.</small></div>`);
    } else {
      try {
        const local = JSON.parse(raw);
        const wouldBe = stateToRows(local, membership.farmId);
        const counts = Object.entries(wouldBe).map(([table, list]) => ({ table, count: list.length }));
        const total = counts.reduce((a, c) => a + c.count, 0);
        push(`<div class="card">${countsTable(counts)}</div>`);
        push(`<div class="card"><div class="verdict ok">${total} rows would be written</div>
          <small style="color:var(--dim);font-size:13px">This is your real season put through the same
          mapping the tests cover — a preview of step 1.7, not a write. Check the movement
          and leg counts look right: legs should exceed movements whenever a load blended
          sources or split across destinations.</small></div>`);
      } catch (e) {
        push(`<div class="card verdict bad">Could not map local data.<small>${e.message}</small></div>`);
      }
    }
  }
}
</script>
</body>
</html>
